
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mobile Truck Simulator 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:8px;left:8px;background:#101b;color:white;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.6}
#top{position:absolute;right:8px;top:8px;display:grid;gap:6px}
button{border:2px solid #ffffff88;background:#172b40dd;color:white;border-radius:12px;font-weight:bold;padding:10px;touch-action:none}
#top button{font-size:12px}
#controls{position:absolute;bottom:12px;left:0;width:100%;display:flex;justify-content:space-between;align-items:end;padding:8px}
.pad{display:grid;gap:5px}
.pad .line{display:flex;gap:5px;justify-content:center}
.control{width:57px;height:55px;font-size:22px}
.action{width:67px;height:52px;font-size:12px}
#rightControls{display:grid;gap:6px}
#hint{position:absolute;top:48%;width:100%;text-align:center;color:white;font-weight:bold;text-shadow:2px 2px 5px black;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
🚛 TRUCK SIMULATOR 3D<br>
Speed: <span id="speed">0</span> km/h<br>
Mode: <span id="mode">Walking</span><br>
Gear: <span id="gear">N</span>
</div>

<div id="top">
<button id="enter">ENTER / EXIT</button>
<button id="camera">CAMERA</button>
<button id="day">DAY / NIGHT</button>
<button id="horn">HORN 🔊</button>
</div>

<div id="hint">WELCOME TO TRUCK SIMULATOR</div>

<div id="controls">
<div class="pad">
<div class="line"><button class="control" id="up">▲</button></div>
<div class="line">
<button class="control" id="left">◀</button>
<button class="control" id="down">▼</button>
<button class="control" id="right">▶</button>
</div>
</div>
<div id="rightControls">
<button class="action" id="run">RUN</button>
<button class="action" id="brake">BRAKE</button>
<button class="action" id="stop">STOP</button>
</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,100,300);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,60,20);
sun.castShadow=true;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff,0x526b43,1.7));

function material(c){return new THREE.MeshStandardMaterial({color:c,roughness:.8})}
const green=material(0x398d35);
const black=material(0x151515);
const white=material(0xffffff);

function cube(w,h,d,color,x,y,z,parent=scene){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 parent.add(o);
 return o;
}

// Ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),green);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Highway
const road=new THREE.Mesh(new THREE.PlaneGeometry(18,1000),material(0x303030));
road.rotation.x=-Math.PI/2;
road.position.y=.03;
scene.add(road);

for(let z=-490;z<500;z+=12){
 cube(.22,.04,6,0xffffff,0,.06,z);
}

// Houses
for(let z=-450;z<450;z+=35){
 for(let side of [-1,1]){
  const x=side*23;
  const h=7+Math.random()*9;
  cube(10,h,10,side===1?0xd3b18b:0xb6c6d4,x,h/2,z);
  cube(10,1,10,0x963d2b,x,h+.5,z);
  for(let y=2;y<h-1;y+=3){
   cube(1.5,1.5,.12,0x65bce0,x-2,y,z-5.08);
   cube(1.5,1.5,.12,0x65bce0,x+2,y,z-5.08);
  }
 }
}

// Trees
for(let z=-450;z<450;z+=22){
 for(let x of [-13,13]){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.3,.45,3,8),material(0x704020));
  trunk.position.set(x,1.5,z);
  scene.add(trunk);
  const leaves=new THREE.Mesh(new THREE.SphereGeometry(2,10,8),material(0x126a27));
  leaves.position.set(x,4,z);
  scene.add(leaves);
 }
}

// Truck
const truck=new THREE.Group();
scene.add(truck);

cube(3,1,7,0x222222,0,1.1,0,truck);
cube(3,2.5,2.5,0xd71920,0,2.3,2,truck);
cube(2.6,1.1,.1,0x80d5ee,0,2.75,3.27,truck);
cube(2.9,2.5,3.8,0x1766ba,0,2.4,-2,truck);

// Headlights
cube(.65,.35,.12,0xffffcc,-1,1.8,3.27,truck);
cube(.65,.35,.12,0xffffcc,1,1.8,3.27,truck);

const wheels=[];
function wheel(x,z){
 const w=new THREE.Mesh(new THREE.CylinderGeometry(.65,.65,.48,20),black);
 w.rotation.z=Math.PI/2;
 w.position.set(x,.7,z);
 truck.add(w);
 wheels.push(w);
 const hub=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.5,16),material(0xaaaaaa));
 hub.rotation.z=Math.PI/2;
 hub.position.copy(w.position);
 truck.add(hub);
}
for(const z of [-2.8,2.1]){
 wheel(-1.55,z);wheel(1.55,z);
}

// Person
const person=new THREE.Group();
scene.add(person);

const skin=material(0xe6a77b);
const shirt=material(0x1565c0);
const pants=material(0x202b40);

function limb(x,y,length,mat){
 const p=new THREE.Group();
 p.position.set(x,y,0);
 const m=new THREE.Mesh(new THREE.BoxGeometry(.23,length,.24),mat);
 m.position.y=-length/2;
 p.add(m);
 person.add(p);
 return p;
}

const body=new THREE.Mesh(new THREE.BoxGeometry(.7,1,.4),shirt);
body.position.y=1.65;
person.add(body);

const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,16),skin);
head.position.y=2.35;
person.add(head);

const arm1=limb(-.48,2.05,.75,skin);
const arm2=limb(.48,2.05,.75,skin);
const leg1=limb(-.22,1.2,.9,pants);
const leg2=limb(.22,1.2,.9,pants);
const limbs=[arm1,arm2,leg1,leg2];

// Starting positions
truck.position.set(0,0,10);
person.position.set(4,0,10);

let driving=false;
let speed=0;
let steering=0;
let camMode=0;
let night=false;
const keys={};

function hold(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
  el.setPointerCapture(e.pointerId);
 });
 function release(){keys[key]=false}
 el.addEventListener("pointerup",release);
 el.addEventListener("pointercancel",release);
 el.addEventListener("lostpointercapture",release);
}
hold("up","up");
hold("down","down");
hold("left","left");
hold("right","right");
hold("run","run");
hold("brake","brake");
hold("stop","stop");

function toggle(){
 if(!driving){
  if(person.position.distanceTo(truck.position)>8)return;
  driving=true;
  person.visible=false;
  speed=0;
 }else{
  driving=false;
  person.visible=true;
  person.position.set(truck.position.x+3,0,truck.position.z);
  person.rotation.y=truck.rotation.y;
 }
 updateHUD();
}
document.getElementById("enter").onclick=toggle;

function updateHUD(){
 document.getElementById("mode").textContent=driving?"Driving":"Walking";
 document.getElementById("gear").textContent=speed>0?"D":speed<0?"R":"N";
}

document.getElementById("camera").onclick=()=>{
 camMode=(camMode+1)%3;
};

document.getElementById("day").onclick=()=>{
 night=!night;
 scene.background=new THREE.Color(night?0x09152e:0x87ceeb);
 scene.fog.color.copy(scene.background);
 sun.intensity=night?.3:2;
};

// Horn
let audio;
function horn(){
 try{
  audio ||= new AudioContext();
  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.frequency.value=230;
  gain.gain.value=.2;
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime+.4);
 }catch(e){}
}
document.getElementById("horn").onclick=horn;

// Keyboard
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(k==="w"||k==="arrowup")keys.up=true;
 if(k==="s"||k==="arrowdown")keys.down=true;
 if(k==="a"||k==="arrowleft")keys.left=true;
 if(k==="d"||k==="arrowright")keys.right=true;
 if(k==="shift")keys.run=true;
 if(k==="e"&&!e.repeat)toggle();
});
window.addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();
 if(k==="w"||k==="arrowup")keys.up=false;
 if(k==="s"||k==="arrowdown")keys.down=false;
 if(k==="a"||k==="arrowleft")keys.left=false;
 if(k==="d"||k==="arrowright")keys.right=false;
 if(k==="shift")keys.run=false;
});

let previous=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-previous)/1000,.04);
 previous=now;

 if(driving){
  if(keys.up)speed+=14*dt;
  if(keys.down)speed-=14*dt;
  if(keys.brake)speed*=.94;
  if(keys.stop)speed*=.75;

  if(!keys.up&&!keys.down)speed*=Math.pow(.985,dt*60);
  speed=THREE.MathUtils.clamp(speed,-12,35);

  steering=keys.left?1:keys.right?-1:0;
  truck.rotation.y+=steering*speed*.018*dt;
  truck.position.x+=Math.sin(truck.rotation.y)*speed*dt;
  truck.position.z+=Math.cos(truck.rotation.y)*speed*dt;

  wheels.forEach(w=>w.rotation.x+=speed*dt*1.5);
 }else{
  const movement=keys.run?8:4;
  let moving=false;

  if(keys.up){
   person.position.x+=Math.sin(person.rotation.y)*movement*dt;
   person.position.z+=Math.cos(person.rotation.y)*movement*dt;
   moving=true;
  }
  if(keys.down){
   person.position.x-=Math.sin(person.rotation.y)*movement*dt;
   person.position.z-=Math.cos(person.rotation.y)*movement*dt;
   moving=true;
  }
  if(keys.left)person.rotation.y+=2.5*dt;
  if(keys.right)person.rotation.y-=2.5*dt;

  const swing=moving?Math.sin(now*.012)*.65:0;
  limbs[0].rotation.x=swing;
  limbs[1].rotation.x=-swing;
  limbs[2].rotation.x=-swing;
  limbs[3].rotation.x=swing;
 }

 // Camera
 let target,cam;
 if(driving){
  target=truck.position.clone();
  target.y+=2;
  if(camMode===0){
   cam=new THREE.Vector3(
    truck.position.x-Math.sin(truck.rotation.y)*12,
    7,
    truck.position.z-Math.cos(truck.rotation.y)*12
   );
  }else if(camMode===1){
   cam=new THREE.Vector3(
    truck.position.x,
    3.3,
    truck.position.z+1
   );
  }else{
   cam=new THREE.Vector3(
    truck.position.x+12,7,truck.position.z+12
   );
  }
 }else{
  target=person.position.clone();
  target.y+=1.3;
  cam=new THREE.Vector3(
   person.position.x-Math.sin(person.rotation.y)*8,
   5,
   person.position.z-Math.cos(person.rotation.y)*8
  );
 }

 camera.position.lerp(cam,1-Math.pow(.001,dt));
 camera.lookAt(target);

 document.getElementById("speed").textContent=
 Math.round(Math.abs(speed)*3.6);

 updateHUD();
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
